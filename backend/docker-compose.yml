# =============================================================================
# docker-compose.yml — Production stack for 灵萌 backend
# =============================================================================
#
# Deployment workflow (first-time and updates):
#   1. Ensure .env is populated with production values (see .env.example)
#   2. Build images:       docker compose build
#   3. Start services:      docker compose up -d
#      (migration runs once and must complete before API/Worker/Realtime start)
#   4. Check health:        docker compose ps
#   5. View logs:           docker compose logs -f app
#
# Updating after code changes:
#   1. docker compose build
#   2. docker compose up -d
#
# Keep one shared env-file declaration for every service. Values containing `$`
# must be single-quoted because Compose also loads this file for interpolation.
x-backend-env-file: &backend-env-file
  - .env

# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NestJS Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: *backend-env-file
    environment:
      SERVICE_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - lingmeng-network
    # Health check at the compose level (in addition to Dockerfile HEALTHCHECK)
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/healthz/services",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Scheduled/background work. No HTTP port is exposed.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file: *backend-env-file
    environment:
      SERVICE_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - lingmeng-network
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # WebSocket/Socket.IO service. Nginx routes /ws-native and /socket.io here.
  # ---------------------------------------------------------------------------
  realtime:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/realtime.js"]
    ports:
      - "3001:3001"
    env_file: *backend-env-file
    environment:
      SERVICE_ROLE: realtime
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - lingmeng-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Database Migrations (one-shot service — runs `prisma migrate deploy`)
  #
  # This applies pending migrations and exits. API/Worker/Realtime wait for it
  # to complete successfully before they start.
  # ---------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # use the builder stage (has devDeps + prisma CLI)
    container_name: lingmeng-migration
    env_file: *backend-env-file
    command:
      - sh
      - -c
      - >-
        if [ -n "$$DATABASE_URL" ]; then
          npx prisma migrate deploy;
        elif [ "$$DB_IS_INSTALLED" = "1" ]; then
          echo "DATABASE_URL is required for an installed deployment" >&2;
          exit 1;
        else
          echo "DATABASE_URL is empty; migration is deferred to the setup wizard";
        fi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lingmeng-network

  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: lingmeng-postgres
    restart: unless-stopped

    # --- Security: do NOT expose 5432 to the host ---
    # No `ports:` directive — only accessible within the Docker network.
    # If you MUST expose it temporarily for debugging, uncomment the
    # line below and bind to 127.0.0.1 only:
    # ports:
    #   - "127.0.0.1:5432:5432"

    env_file: *backend-env-file
    environment:
      # POSTGRES_PASSWORD is read directly from env_file to avoid a second
      # Compose interpolation pass for passwords containing `$`.
      POSTGRES_USER: ${POSTGRES_USER:-lingmeng}
      POSTGRES_DB: ${POSTGRES_DB:-lingmeng_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lingmeng-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lingmeng} -d ${POSTGRES_DB:-lingmeng_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lingmeng-redis
    restart: unless-stopped

    # --- Security: do NOT expose 6379 to the host ---
    # Redis is only reachable within the Docker network.
    # Uncomment below to temporarily expose (bind to localhost only):
    # ports:
    #   - "127.0.0.1:6379:6379"

    env_file: *backend-env-file
    # Require a password for Redis connections (AUTH)
    # If REDIS_PASSWORD is not set in .env, Redis runs without a password.
    # You MUST set REDIS_PASSWORD in production.
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}";
        else
          exec redis-server;
        fi
      '
    volumes:
      - redis_data:/data
    networks:
      - lingmeng-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# =============================================================================
# Named Volumes (persist data across container rebuilds)
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  lingmeng-network:
    driver: bridge
